<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>ITC Care - Hệ Thống Chăm Sóc & Điểm Danh Sinh Viên</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- PWA Mobile Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ITC Care" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-100 selection:text-blue-900"
  >
    <app-root></app-root>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (registration) {
              console.log(' [PWA] ServiceWorker registered with scope:', registration.scope);
            })
            .catch(function (err) {
              console.log(' [PWA] ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
