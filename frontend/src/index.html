<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>ITC CARE</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- PWA Mobile Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#673ab7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ITC CARE" />

    <link rel="icon" type="image/png" href="logo_truong.png" />
    <link rel="apple-touch-icon" href="logo_truong.png" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Berry-style theme: remaps the existing blue/violet/slate utility classes app-wide
         (primary blue #2196F3, secondary deep purple #673AB7, Berry greys), softer weights
         and 12px card radius. -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--font-sans)'],
            },
            colors: {
              blue: {
                50: '#e3f2fd',
                100: '#bbdefb',
                200: '#90caf9',
                300: '#64b5f6',
                400: '#42a5f5',
                500: '#2196f3',
                600: '#1e88e5',
                700: '#1976d2',
                800: '#1565c0',
                900: '#0d47a1',
                950: '#0a3677',
              },
              violet: {
                50: '#ede7f6',
                100: '#d1c4e9',
                200: '#b39ddb',
                300: '#9575cd',
                400: '#7e57c2',
                500: '#673ab7',
                600: '#5e35b1',
                700: '#512da8',
                800: '#4527a0',
                900: '#311b92',
                950: '#24146b',
              },
              slate: {
                50: '#f8fafc',
                100: '#eef2f6',
                200: '#e3e8ef',
                300: '#cdd5df',
                400: '#9aa4b2',
                500: '#697586',
                600: '#4b5565',
                700: '#364152',
                800: '#202939',
                900: '#121926',
                950: '#0d121c',
              },
            },
            fontWeight: { extrabold: '700', black: '700' },
            borderRadius: { '2xl': '12px', '3xl': '16px' },
            boxShadow: {
              sm: '0 1px 2px 0 rgba(32, 40, 45, 0.04)',
              DEFAULT: '0 2px 14px 0 rgba(32, 40, 45, 0.08)',
              lg: '0 8px 24px 0 rgba(32, 40, 45, 0.08)',
              xl: '0 12px 32px 0 rgba(32, 40, 45, 0.12)',
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-100 selection:text-blue-900"
  >
    <app-root></app-root>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (registration) {
              console.log(' [PWA] ServiceWorker registered with scope:', registration.scope);
            })
            .catch(function (err) {
              console.log(' [PWA] ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
