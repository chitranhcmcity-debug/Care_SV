<div class="dc" aria-hidden="true" (mouseenter)="paused = true" (mouseleave)="paused = false">
  <div class="dc-under dc-under--2"></div>
  <div class="dc-under dc-under--1"></div>
  <div class="dc-rings">
    <span *ngFor="let r of rings" class="dc-ring"></span>
  </div>

  <div #frame class="dc-frame" [style.height.px]="H * scale()">
    <div
      *ngFor="let p of pages; let pi = index"
      class="dc-page"
      [class.is-current]="pi === page()"
      [class.is-next]="pi === next() && turning() >= 0"
      [class.is-turning]="pi === turning()"
    >
      <!-- Mặt sau của tờ, thấy khi nó đã lật qua phương thẳng đứng -->
      <div class="dc-back"></div>

      <div class="dc-front" [ngClass]="p.theme">
        <div
          class="dc-canvas"
          [style.width.px]="W"
          [style.height.px]="H"
          [style.transform]="'scale(' + scale() + ')'"
        >
          <!-- các hình khối trang trí -->
          <span class="pg-blob pg-blob--a"></span>
          <span class="pg-blob pg-blob--b"></span>

          <div class="position-relative h-100 d-grid grid-cols-1-105 gap-10 px-14 pt-16 pb-12">
            <!-- Nội dung -->
            <div class="d-flex flex-column justify-content-center">
              <span class="pg-kicker">{{ p.kicker }}</span>
              <h3
                class="mt-4 fs-44px fw-bold lh-1-1 tracking-tight text-slate-900"
              >
                <span class="d-block">{{ p.title[0] }}</span>
                <span class="d-block pg-grad">{{ p.title[1] }}</span>
              </h3>
              <p class="mt-4 fs-17px lh-relaxed text-slate-600">{{ p.text }}</p>
              <ul class="mt-6 space-y-3">
                <li
                  *ngFor="let pt of p.points"
                  class="d-flex align-items-center gap-3 fs-16px fw-semibold text-slate-800"
                >
                  <span class="pg-check">
                    <svg
                      class="w-4 h-4"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="3"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path [attr.d]="i.check" />
                    </svg>
                  </span>
                  {{ pt }}
                </li>
              </ul>
            </div>

            <!-- Hình minh họa -->
            <div class="position-relative d-flex align-items-center justify-content-center" [ngSwitch]="p.id">
              <!-- 01: thẻ điểm danh trừu tượng -->
              <ng-container *ngSwitchCase="'attendance'">
                <div class="pg-card w-380px p-6 rotate-n2">
                  <div class="d-flex align-items-center gap-3">
                    <span class="pg-tile bg-gradient-to-br from-violet-500 to-fuchsia-500">
                      <svg
                        class="w-6 h-6"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path [attr.d]="i.calendar" />
                      </svg>
                    </span>
                    <div class="flex-1 space-y-2">
                      <span class="d-block h-3 w-40 rounded-pill bg-slate-200"></span>
                      <span class="d-block h-2-5 w-24 rounded-pill bg-slate-100"></span>
                    </div>
                  </div>
                  <div class="mt-5 space-y-3">
                    <div *ngFor="let r of rows" class="d-flex align-items-center gap-3">
                      <span class="w-9 h-9 rounded-pill bg-gradient-to-br" [ngClass]="r.av"></span>
                      <span class="flex-1 h-2-5 rounded-pill bg-slate-100">
                        <span
                          class="d-block h-100 rounded-pill bg-slate-200"
                          [style.width.%]="r.w"
                        ></span>
                      </span>
                      <span class="pg-dot" [ngClass]="'is-' + r.state"></span>
                    </div>
                  </div>
                </div>
                <div
                  class="pg-card pg-float position-absolute end-2 bottom-6 px-5 py-4 d-flex align-items-center gap-3"
                >
                  <svg viewBox="0 0 36 36" class="w-14 h-14 rotate-n90">
                    <circle cx="18" cy="18" r="14" fill="none" stroke="#ede9fe" stroke-width="5" />
                    <circle
                      cx="18"
                      cy="18"
                      r="14"
                      fill="none"
                      stroke="url(#pgRing)"
                      stroke-width="5"
                      stroke-dasharray="80 88"
                      stroke-linecap="round"
                    />
                    <defs>
                      <linearGradient id="pgRing" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#8b5cf6" />
                        <stop offset="1" stop-color="#ec4899" />
                      </linearGradient>
                    </defs>
                  </svg>
                  <div class="lh-sm">
                    <div class="fs-13px text-slate-500">Chuyên cần</div>
                    <div class="fs-18px fw-bold text-violet-700">Tự động tính</div>
                  </div>
                </div>
              </ng-container>

              <!-- 02: luồng chăm sóc -->
              <ng-container *ngSwitchCase="'care'">
                <div class="position-relative w-400px space-y-4">
                  <span class="pg-flow-line"></span>
                  <div
                    *ngFor="let f of flow; let fi = index"
                    class="pg-card position-relative d-flex align-items-center gap-4 px-5 py-4"
                    [style.marginLeft.px]="fi % 2 ? 40 : 0"
                  >
                    <span class="pg-tile bg-gradient-to-br" [ngClass]="f.tone">
                      <svg
                        class="w-6 h-6"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path [attr.d]="f.icon" />
                      </svg>
                    </span>
                    <span class="flex-1 fs-17px fw-bold text-slate-800">{{ f.label }}</span>
                    <span class="fs-13px fw-bold text-slate-300">0{{ fi + 1 }}</span>
                  </div>
                </div>
              </ng-container>

              <!-- 03: chat AI + biểu đồ trừu tượng -->
              <ng-container *ngSwitchCase="'ai'">
                <div class="position-relative w-410px space-y-3">
                  <div class="pg-bubble pg-bubble--me ms-auto">Lớp nào đang vắng nhiều nhất?</div>
                  <div class="d-flex align-items-end gap-3">
                    <img
                      src="robot-ai-right.webp"
                      alt=""
                      width="90"
                      height="75"
                      class="w-84px h-auto flex-shrink-0 pg-float"
                    />
                    <div class="pg-bubble pg-bubble--ai">
                      <span class="d-flex align-items-center gap-1-5 fw-bold text-teal-700">
                        <svg
                          class="w-4 h-4"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path [attr.d]="i.sparkles" />
                        </svg>
                        AI Care
                      </span>
                      Mình đã tổng hợp và gợi ý các bước chăm sóc cho bạn.
                    </div>
                  </div>
                  <div class="pg-card p-5">
                    <div class="d-flex align-items-center gap-2 fs-14px fw-bold text-slate-700">
                      <svg
                        class="w-5 h-5 text-teal-600"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                      >
                        <path [attr.d]="i.chart" />
                      </svg>
                      Báo cáo trực quan
                    </div>
                    <div class="mt-4 h-110px d-flex align-items-end gap-3">
                      <span
                        *ngFor="let b of bars; let last = last"
                        class="flex-1 rounded-top-lg"
                        [ngClass]="
                          last
                            ? 'bg-gradient-to-t from-teal-500 to-cyan-300'
                            : 'bg-gradient-to-t from-indigo-200 to-violet-100'
                        "
                        [style.height.%]="b"
                      ></span>
                    </div>
                  </div>
                </div>
              </ng-container>
            </div>
          </div>

          <!-- số trang -->
          <span class="position-absolute end-24 bottom-6 fs-14px fw-bold text-slate-400">
            {{ pi + 1 }} / {{ pages.length }}
          </span>
        </div>
        <!-- góc gập gợi ý chỗ nhấc lên -->
        <span class="dc-corner"></span>
      </div>
    </div>
  </div>
</div>

<!-- Tab trang dưới lịch -->
<div class="dc-nav mt-7 d-flex flex-wrap align-items-center justify-content-center gap-2">
  <button
    *ngFor="let p of pages; let pi = index"
    type="button"
    class="dc-tab"
    [class.is-on]="pi === page()"
    (click)="go(pi)"
  >
    <span class="dc-dot"></span>{{ p.label }}
  </button>
</div>
