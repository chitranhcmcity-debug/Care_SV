<!-- Launcher: the AI Care robot wanders around the screen; clicking it opens the chat -->
<button
  type="button"
  class="robot-launcher"
  [class.is-flying]="flying()"
  [class.is-dragging]="dragging()"
  [style.transform]="'translate3d(' + pos().x + 'px,' + pos().y + 'px,0)'"
  [style.transition-duration]="travelMs() + 'ms'"
  (click)="onClick()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (mouseenter)="pause()"
  (mouseleave)="resume()"
  (focus)="pause()"
  (blur)="resume()"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="open() ? 'Đóng trợ lý AI Care' : 'Mở trợ lý AI Care'"
>
  <span class="robot-tip">{{
    open() ? 'Đóng AI Care' : 'Hỏi AI Care · giữ & kéo để dời chỗ'
  }}</span>
  <span class="robot-body" [style.--tilt]="tilt() + 'deg'">
    <!-- Two drawings of the wizard robot; the one facing the flight direction is shown. -->
    <span class="robot-float">
      <img
        src="robot-ai-left.png"
        alt=""
        class="robot-img"
        [class.is-shown]="facing() === 'left'"
        draggable="false"
      />
      <img
        src="robot-ai-right.png"
        alt=""
        class="robot-img"
        [class.is-shown]="facing() === 'right'"
        draggable="false"
      />
    </span>
  </span>
  <span class="robot-shadow"></span>
</button>

<!-- Panel -->
<section
  *ngIf="open()"
  class="fixed z-50 bottom-32 right-4 left-4 sm:left-auto sm:right-5 sm:w-[420px] h-[min(640px,calc(100vh-8rem))] bg-white rounded-xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden"
  role="dialog"
  aria-label="Trợ lý AI Care"
>
  <header class="px-4 py-3 bg-violet-600 text-white flex items-center gap-3">
    <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-bold">
      AI
    </div>
    <div class="flex-1 min-w-0">
      <div class="font-semibold leading-tight">AI Care</div>
      <div class="text-xs text-white/80 truncate">
        Trợ lý dành cho {{ profile()?.roleLabel || '...' }}
      </div>
    </div>
    <button
      *ngIf="messages().length"
      type="button"
      (click)="reset()"
      class="text-xs px-2 py-1 rounded-md bg-white/15 hover:bg-white/25"
      title="Bắt đầu cuộc trò chuyện mới"
    >
      Làm mới
    </button>
    <button
      type="button"
      (click)="toggle()"
      class="w-8 h-8 -mr-1 rounded-md flex items-center justify-center hover:bg-white/20"
      title="Đóng"
      aria-label="Đóng trợ lý AI Care"
    >
      <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </header>

  <div #scroller class="flex-1 overflow-y-auto px-4 py-3 space-y-3 bg-slate-50 text-sm">
    <!-- Welcome: what AI Care does for this role -->
    <div *ngIf="!messages().length" class="space-y-3">
      <div class="bg-white border border-slate-200 rounded-lg p-3">
        <p class="text-slate-800">
          Xin chào! Tôi là <strong>AI Care</strong>.
          <ng-container *ngIf="profile() as p">{{ p.focus }}</ng-container>
        </p>
        <div *ngIf="profile()?.capabilities?.length" class="mt-2">
          <div class="text-xs font-semibold text-slate-500 uppercase mb-1">Tôi có thể tra cứu</div>
          <ul class="list-disc pl-5 text-slate-700 space-y-0.5">
            <li *ngFor="let c of profile()!.capabilities">{{ c }}</li>
          </ul>
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <button
          *ngFor="let s of profile()?.suggestions"
          type="button"
          (click)="send(s)"
          class="text-left px-3 py-2 rounded-lg border border-violet-200 bg-white text-violet-700 hover:bg-violet-50"
        >
          {{ s }}
        </button>
      </div>
    </div>

    <ng-container *ngFor="let m of messages()">
      <div *ngIf="m.role === 'user'" class="flex justify-end">
        <div class="max-w-[85%] px-3 py-2 rounded-lg bg-violet-600 text-white whitespace-pre-wrap">
          {{ m.content }}
        </div>
      </div>
      <div *ngIf="m.role === 'assistant'" class="flex">
        <div
          class="max-w-[92%] px-3 py-2 rounded-lg bg-white border border-slate-200 text-slate-800 space-y-1.5"
          [innerHTML]="m.html"
        ></div>
      </div>
    </ng-container>

    <div *ngIf="loading()" class="flex">
      <div class="px-3 py-2 rounded-lg bg-white border border-slate-200 text-slate-500">
        AI Care đang tra cứu dữ liệu…
      </div>
    </div>
    <div
      *ngIf="error()"
      class="px-3 py-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-700"
    >
      {{ error() }}
    </div>
  </div>

  <form class="p-3 border-t border-slate-200 flex gap-2 bg-white" (ngSubmit)="send()">
    <textarea
      name="draft"
      [(ngModel)]="draft"
      (keydown)="onKeydown($event)"
      rows="1"
      maxlength="4000"
      placeholder="Hỏi AI Care…"
      class="flex-1 resize-none rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-violet-400"
    ></textarea>
    <button
      type="submit"
      [disabled]="loading() || !draft.trim()"
      class="px-4 rounded-lg bg-violet-600 text-white text-sm font-medium hover:bg-violet-700 disabled:opacity-50"
    >
      Gửi
    </button>
  </form>
  <p class="px-3 pb-2 text-[11px] text-slate-400 bg-white">
    AI có thể sai sót; hãy kiểm tra lại trước khi quyết định.
  </p>
</section>
