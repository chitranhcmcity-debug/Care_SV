<!-- Signed-in app shell (sidebar + header); the routed page is projected into its <main> -->
<app-navbar *ngIf="showDashboard; else publicShell">
  <router-outlet></router-outlet>
</app-navbar>

<!-- AI Care assistant (signed-in pages only; tools depend on role) -->
<app-ai-care *ngIf="showDashboard"></app-ai-care>

<!-- Public pages (home, login): full-width, no app shell -->
<ng-template #publicShell>
  <div class="min-h-screen bg-slate-50 text-slate-900 font-sans">
    <router-outlet></router-outlet>
  </div>
</ng-template>

<!-- App-wide toasts + confirm dialog (NotificationService) -->
<app-notifications></app-notifications>

<!-- App-wide call dialog (CallService.open) -->
<app-call-dialog></app-call-dialog>
