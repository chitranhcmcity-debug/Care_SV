<!-- Khung ứng dụng đã đăng nhập (sidebar + header); trang theo route được chiếu vào <main> của nó -->
<app-navbar *ngIf="showDashboard; else publicShell">
  <router-outlet></router-outlet>
</app-navbar>

<!-- Trợ lý AI Care (chỉ ở các trang đã đăng nhập; công cụ tùy theo vai trò). Nạp khi trang rảnh,
     để mã của nó không nằm trong lần tải đầu tiên. -->
@if (showDashboard) {
  @defer (on idle) {
    <app-ai-care></app-ai-care>
  }
}

<!-- Trang công khai (trang chủ, đăng nhập): toàn chiều rộng, không có khung ứng dụng -->
<ng-template #publicShell>
  <div class="min-h-screen bg-slate-50 text-slate-900 font-sans">
    <router-outlet></router-outlet>
  </div>
</ng-template>

<!-- Toast toàn ứng dụng + hộp thoại xác nhận (NotificationService) -->
<app-notifications></app-notifications>

<!-- Hộp thoại gọi điện toàn ứng dụng (CallService.open); chỉ trang đã đăng nhập mới gọi điện. -->
@if (showDashboard) {
  @defer (on idle) {
    <app-call-dialog></app-call-dialog>
  }
}

<!-- Logo loading khi một trang (mã hoặc dữ liệu mở đầu) đang tải; xem LoadingService -->
@if (loading.visible()) {
  <div class="logo-loader" role="status" aria-live="polite">
    <div class="logo-loader__ring">
      <img [src]="branding.logo()" alt="Logo" width="96" height="96" />
    </div>
    <span class="logo-loader__text">Đang tải</span>
  </div>
}
