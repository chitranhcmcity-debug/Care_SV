<!-- Signed-in app shell (sidebar + header); the routed page is projected into its <main> -->
<app-navbar *ngIf="showDashboard; else publicShell">
  <router-outlet></router-outlet>
</app-navbar>

<!-- AI Care assistant (signed-in pages only; tools depend on role). Loaded once the page is idle,
     so its code is not part of the first download. -->
@if (showDashboard) {
  @defer (on idle) {
    <app-ai-care></app-ai-care>
  }
}

<!-- Public pages (home, login): full-width, no app shell -->
<ng-template #publicShell>
  <div class="min-h-screen bg-slate-50 text-slate-900 font-sans">
    <router-outlet></router-outlet>
  </div>
</ng-template>

<!-- App-wide toasts + confirm dialog (NotificationService) -->
<app-notifications></app-notifications>

<!-- App-wide call dialog (CallService.open); only signed-in pages place calls. -->
@if (showDashboard) {
  @defer (on idle) {
    <app-call-dialog></app-call-dialog>
  }
}

<!-- Logo loader while a page (code or its opening data) is loading; see LoadingService -->
@if (loading.visible()) {
  <div class="logo-loader" role="status" aria-live="polite">
    <div class="logo-loader__ring">
      <img [src]="branding.logo()" alt="Logo" width="96" height="96" />
    </div>
    <span class="logo-loader__text">Đang tải</span>
  </div>
}
